name: codebound-kit-mocks
# Set image file modes explicitly: existing checkouts may use a private umask.
x-mock-build: &mock-build
  dockerfile_inline: |
    FROM node:22-alpine
    WORKDIR /kit
    COPY --chmod=0444 data.mjs reference.mjs server.mjs ./mocks/
    RUN chmod 0555 /kit/mocks && mkdir -p /data && chown node:node /data
    ENV DATA_DIR=/data
    USER node
    CMD ["node", "mocks/server.mjs"]
services:
  mocks:
    container_name: codebound-kit-mocks
    image: codebound-kit-mocks:local
    build: *mock-build
    environment:
      DATA_DIR: /data
    ports: !override
      - "127.0.0.1:14101:4101"
      - "127.0.0.1:14102:4102"
      - "127.0.0.1:14103:4103"
      - "127.0.0.1:14104:4104"
      - "127.0.0.1:14180:4180"
  outside:
    container_name: codebound-kit-outside
    image: codebound-kit-mocks:local
    build: *mock-build
    ports: !override
      - "127.0.0.1:14199:4199"
      - "127.0.0.1:14181:4181"
networks:
  codebound:
    name: codebound-kit-mocks

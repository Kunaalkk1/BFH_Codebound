name: codebound-host
services:
  app:
    image: ${ANYTHINGMCP_IMAGE:?run python launch.py first}
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3200:3000"
      - "127.0.0.1:4300:4000"
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: self-hosted
      PORT: 4000
      DATABASE_URL: postgresql://amcp:${POSTGRES_PASSWORD}@postgres:5432/anythingmcp
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_API_URL: http://localhost:4300
      CORS_ORIGIN: http://localhost:3200
      SERVER_URL: http://localhost:4300
      FRONTEND_URL: http://localhost:3200
      MCP_AUTH_MODE: both
      MCP_ALLOW_ANONYMOUS: "false"
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: anythingmcp
    volumes:
      - host_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U amcp -d anythingmcp]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  host_postgres_data:
